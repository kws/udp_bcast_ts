name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run checks
        run: scripts/check.sh

      - name: Build Linux x86_64 artifact
        run: scripts/build-linux-x86_64.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}" \
            "dist/udp_bcast_ts-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu" \
            "dist/udp_bcast_ts-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.sha256"
